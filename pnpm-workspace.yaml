configDependencies:
  "@pnpm/pacquet": 0.11.12
linkWorkspacePackages: true
saveWorkspaceProtocol: rolling
saveExact: true
strictSsl: true
minimumReleaseAge: 4320 # Minutes = 3 Days
minimumReleaseAgeExclude:
  - "@rimelight/*"
  # Vulnerabilty Fixes
  - brace-expansion
overrides:
  esbuild: "0.28.1"
  sharp: "0.35.0"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
